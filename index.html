<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Routine Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Quicksand:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#000; --bg2:#0a0a0a; --card:rgba(255,255,255,.05); --cardb:rgba(255,255,255,.17);
  --ink:#f5f5f5; --muted:#a3a3b8; --cyan:#5ee7ff; --violet:#a78bff; --pink:#ff7ad9; --mint:#5cf2b0; --amber:#ffc857;
  --grad:linear-gradient(135deg,#5ee7ff,#a78bff 55%,#ff7ad9);
  --head:"Fraunces",Georgia,serif; --body:"Quicksand","Trebuchet MS",system-ui,sans-serif; --hand:"Caveat","Segoe Script",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);line-height:1.5;
  background:radial-gradient(1000px 600px at 12% -10%,#272727 0%,transparent 60%),linear-gradient(170deg,#0b0b0b,#000);
  background-attachment:fixed;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* floating aurora blobs + stars */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.35;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#5ee7ff;top:-80px;right:-80px}
.b2{width:380px;height:380px;background:#9b8cff;bottom:-120px;left:-100px;animation-delay:-6s}
.b3{width:260px;height:260px;background:#ff8fd8;top:45%;left:55%;opacity:.18;animation-delay:-11s}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.15)}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}

.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 120px}
header{text-align:center;margin:10px 0 18px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(1.8rem,7vw,2.8rem);margin:0;letter-spacing:-.01em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.tag{color:var(--muted);font-size:.95rem;margin-top:2px}

.glass{background:var(--card);border:1px solid var(--cardb);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35)}

/* month bar */
.months{display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:12px}
.months button{width:44px;height:44px;border-radius:14px;border:1px solid var(--cardb);background:rgba(255,255,255,.08);color:var(--ink);font-size:1.3rem;cursor:pointer;transition:.2s}
.months button:hover:not(:disabled){background:var(--grad);color:#000;transform:scale(1.07)}
.months button:disabled{opacity:.3}
.months select{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--cardb);background:rgba(255,255,255,.08);color:var(--ink);font:700 1.05rem var(--head);padding:0 12px;text-align:center}
.months select option{color:#111}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;margin-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--violet) transparent}
.day{flex:0 0 66px;scroll-snap-align:center;border-radius:18px;border:1px solid var(--cardb);background:var(--card);color:var(--ink);padding:8px 2px 6px;text-align:center;cursor:pointer;font-family:var(--body);transition:transform .2s,box-shadow .2s,background .2s;position:relative}
.day:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(94,231,255,.25)}
.day .wd{font-size:.72rem;color:var(--muted);font-weight:700}
.day .dn{font-family:var(--head);font-size:1.4rem;font-weight:800;line-height:1.1}
.day .meta{font-size:.62rem;color:var(--cyan);min-height:1.8em;line-height:1.25}
.day.today::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.day.sel{background:var(--grad);color:#000;border-color:transparent;transform:translateY(-4px) scale(1.05);box-shadow:0 10px 26px rgba(167,139,255,.5)}
.day.sel .wd,.day.sel .meta{color:#222}
.day.run{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(92,242,176,.25)}}

/* panel */
.panel{padding:18px 16px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h2{font-family:var(--head);font-size:clamp(1.2rem,5vw,1.6rem);margin:0;line-height:1.2}
.sub{color:var(--mint);font-size:.85rem;font-weight:700;min-height:1.2em}
.ring{flex:none;width:64px;height:64px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:url(#g);transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.85rem}

/* timer */
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;margin-bottom:20px;background:linear-gradient(135deg,rgba(94,231,255,.12),rgba(167,139,255,.14));border:1px solid var(--cardb)}
.timer.on{box-shadow:0 0 0 2px rgba(92,242,176,.5),0 0 30px rgba(92,242,176,.25)}
.time{font-family:var(--head);font-size:clamp(1.9rem,9vw,2.5rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.time small{display:block;font:600 .75rem var(--body);color:var(--muted)}
.tbtn{border:0;border-radius:16px;padding:13px 26px;font:700 1rem var(--body);cursor:pointer;color:#000;background:linear-gradient(135deg,var(--mint),var(--cyan));transition:transform .15s}
.tbtn:active{transform:scale(.94)}
.tbtn.stop{background:linear-gradient(135deg,#ff9a8b,var(--pink))}
.note{font-size:.78rem;color:var(--muted);width:100%}

/* sections */
.label{font-family:var(--head);font-size:1.05rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;min-width:0;height:48px;border-radius:16px;border:1px solid var(--cardb);background:rgba(255,255,255,.07);color:var(--ink);font:600 1rem var(--body);padding:0 14px}
input::placeholder,textarea::placeholder{color:#777}
.plus{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--grad);color:#000;font-size:1.9rem;line-height:1;cursor:pointer;transition:transform .25s;box-shadow:0 6px 18px rgba(167,139,255,.5)}
.plus:hover{transform:rotate(90deg) scale(1.1)}
.plus:active{transform:scale(.88)}

ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 12px;margin-bottom:8px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid transparent;animation:pop .35s cubic-bezier(.3,1.4,.5,1);transition:background .3s,border-color .3s}
li:hover{border-color:var(--cardb)}
li.done{background:rgba(92,242,176,.07)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.95)}}
.chk{position:relative;flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--cyan);background:transparent;cursor:pointer;display:grid;place-items:center;color:#000;font-weight:800;transition:.25s}
li.done .chk{background:linear-gradient(135deg,var(--mint),var(--cyan));border-color:transparent;transform:rotate(360deg)}
.body{flex:1;min-width:0}
.txt{position:relative;display:inline-block;max-width:100%;word-break:break-word;font-weight:600;transition:color .5s}
.when{display:block;font-size:.78rem;color:var(--cyan);font-weight:700;margin-top:2px}
li.done .when{color:#666}
.txt::after{content:"";position:absolute;left:-3px;top:50%;height:3px;border-radius:3px;width:calc(100% + 6px);background:linear-gradient(90deg,var(--pink),var(--violet));
  transform:scaleX(0);transform-origin:left center;transition:transform .5s cubic-bezier(.65,.05,.2,1)}
li.done .txt{color:#666}
li.done .txt::after{transform:scaleX(1)}
.del{background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:6px 8px;border-radius:10px;transition:.2s}
.del:hover{color:var(--pink);background:rgba(255,122,217,.12)}
.empty{color:var(--muted);text-align:center;padding:10px 0 14px;font-size:.92rem}
.count{font-size:.85rem;color:var(--muted);margin:2px 0 20px}

/* diary */
.diary{margin-top:6px;padding:14px;border-radius:20px;background:linear-gradient(160deg,rgba(255,122,217,.1),rgba(167,139,255,.1));border:1px solid var(--cardb)}
.moods{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.moods button{width:46px;height:46px;border-radius:14px;border:1px solid var(--cardb);background:rgba(255,255,255,.06);font-size:1.5rem;cursor:pointer;transition:.2s;filter:grayscale(.8)}
.moods button:hover{transform:translateY(-3px) scale(1.1);filter:none}
.moods button.on{background:var(--grad);filter:none;transform:scale(1.12);box-shadow:0 6px 16px rgba(167,139,255,.5)}
textarea{width:100%;min-height:150px;resize:vertical;border-radius:16px;border:1px solid var(--cardb);background:rgba(0,0,0,.45);color:var(--ink);font:500 1.35rem/1.55 var(--hand);padding:12px 14px;
  background-image:repeating-linear-gradient(transparent,transparent 29px,rgba(167,139,255,.18) 30px);background-attachment:local}
textarea:focus,.add input:focus{outline:2px solid var(--cyan);outline-offset:1px}
.dfoot{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:6px}
.dfoot b{color:var(--mint);transition:opacity .4s}

footer{text-align:center;margin-top:28px;color:var(--muted);font-family:var(--hand);font-size:1.45rem;line-height:1.3}
footer span{display:block;font-size:1.15rem;opacity:.85}
footer .heart{color:var(--pink);display:inline-block;animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.35)}}

/* confetti */
.cf{position:fixed;z-index:50;width:9px;height:9px;border-radius:2px;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

button:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* task times */
.times{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:.85rem;color:var(--muted)}
.times label{display:flex;align-items:center;gap:6px;font-weight:700}
.times input{height:40px;border-radius:12px;border:1px solid var(--cardb);background:rgba(255,255,255,.07);color:var(--ink);font:600 1rem var(--body);padding:0 8px;color-scheme:dark}
.err{color:var(--pink);font-size:.85rem;font-weight:700;margin-bottom:8px}
.err.show{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Mochi the cat */
.catbox{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;width:78px;height:78px}
.cat{width:78px;height:78px;border:0;border-radius:50%;padding:0;cursor:pointer;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.45),rgba(0,0,0,.7));box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.15);transition:transform .2s}
.cat:hover{transform:scale(1.08)}
.cat svg{display:block;overflow:visible;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.tail{transform-origin:72px 84px;animation:wag 1.8s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(14deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.cat.jump{animation:hop .9s ease;box-shadow:0 0 0 4px rgba(94,231,255,.5),0 0 30px rgba(94,231,255,.6)}
@keyframes hop{0%,100%{transform:translateY(0)}20%{transform:translateY(-22px)}40%{transform:translateY(0)}60%{transform:translateY(-14px)}80%{transform:translateY(0)}}
.bubble{position:absolute;right:0;bottom:90px;width:max-content;max-width:min(260px,calc(100vw - 30px));padding:10px 14px;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#c8f6ff,#e2d9ff,#ffd3f2);color:#14143a;font:600 .9rem/1.35 var(--body);box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(8px) scale(.95);pointer-events:none;transition:.3s;cursor:pointer}
.bubble.show{opacity:1;transform:none;pointer-events:auto}
.chatopen .bubble{display:none}
.chat{position:absolute;right:0;bottom:90px;width:min(350px,calc(100vw - 24px));height:min(72vh,480px);display:none;flex-direction:column;overflow:hidden;background:rgba(12,12,12,.98)}
.chatopen .chat{display:flex;animation:pop .3s}
.chead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-family:var(--head);background:var(--grad);color:#000}
.chead button{background:none;border:0;font-size:1.1rem;cursor:pointer;color:#000}
.cset{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:8px 10px;font-size:.75rem;border-bottom:1px solid var(--cardb);align-items:center;color:var(--muted)}
.cset button,.cset select{height:30px;border-radius:10px;border:1px solid var(--cardb);background:rgba(255,255,255,.08);color:var(--ink);font:700 .75rem var(--body);padding:0 8px;cursor:pointer}
.cset select option{color:#111}
.msgs{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--violet) transparent}
.msg{flex:none;max-width:85%;width:fit-content;padding:8px 12px;overflow-wrap:anywhere;border-radius:14px;font-size:.92rem;line-height:1.35;animation:pop .25s}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.12);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--grad);color:#000;font-weight:600;border-bottom-right-radius:4px}
.chips{flex:none;display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px}
.chips button{flex:none;border-radius:999px;border:1px solid var(--cardb);background:rgba(255,255,255,.07);color:var(--ink);font:600 .78rem var(--body);padding:6px 12px;cursor:pointer}
.chips button:hover{background:var(--grad);color:#000}
.cin{flex:none;display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--cardb)}
.cin input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--cardb);background:rgba(255,255,255,.07);color:var(--ink);font:600 16px var(--body);padding:0 12px}
.cin button{border:0;border-radius:12px;padding:0 14px;background:var(--grad);color:#000;font:700 .9rem var(--body);cursor:pointer}
@media (max-width:480px){.wrap{padding:12px 10px 110px}.panel{padding:14px 12px 16px}.ring{width:54px;height:54px}.tbtn{flex:1}.day{flex-basis:60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* black & white polish */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%)}
.blob{opacity:.2!important}.b3{opacity:.1!important}
h1{background:linear-gradient(90deg,#5ee7ff,#a78bff,#ff7ad9,#ffc857,#5ee7ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{border-color:rgba(255,255,255,.2);box-shadow:0 14px 50px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.1)}
.tbtn.stop{background:linear-gradient(135deg,#ff9a8b,#ff7ad9);color:#000;box-shadow:none}
.err{color:#ff6b7a}
.cat{background:radial-gradient(circle at 50% 40%,rgba(167,139,255,.5),rgba(0,0,0,.85))}

/* streak badge (top left) */
header{display:flex;flex-direction:column;align-items:center}
.streak{align-self:flex-start;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;margin-bottom:12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);transition:.4s;text-align:left}
.streak .flame{flex:none;width:44px;height:44px;transform-origin:50% 90%;animation:flick 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px rgba(255,120,30,.6))}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(1.07,1.13) rotate(2deg)}}
.streak.cold .flame{filter:grayscale(1) brightness(.55);animation:none}
.streak.risk .flame{animation-duration:2.2s;filter:drop-shadow(0 0 5px rgba(255,120,30,.35))}
.streak.lit{border-color:#ffb347;box-shadow:0 0 28px rgba(255,140,40,.35)}
.streak.lit .flame{filter:drop-shadow(0 0 14px rgba(255,150,40,.9))}
.snum{font-size:.8rem;color:var(--muted);line-height:1.1}
.snum b{font:800 1.7rem var(--head);color:var(--amber);display:inline-block}
.snum b.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.6) rotate(-6deg)}}
.pips{display:flex;gap:4px;margin:4px 0 3px}
.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);transition:.4s}
.pips i.on{background:#ff4d5e;box-shadow:0 0 8px #ff4d5e}
.ssub{font-size:.7rem;color:var(--muted);max-width:190px;line-height:1.25}

/* priority */
li{box-shadow:inset 4px 0 0 var(--pc,transparent)}
li.p-low,.prio .p-low{--pc:#3ddc84}li.p-mid,.prio .p-mid{--pc:#ffd23f}li.p-high,.prio .p-high{--pc:#ff4d5e}
.pri{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.4);padding:0;cursor:pointer;background:var(--pc);box-shadow:0 0 10px var(--pc);transition:transform .2s}
.pri:hover{transform:scale(1.25)}
li.done .pri{opacity:.4}
.prio{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:.85rem;color:var(--muted);font-weight:700}
.prio button{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--cardb);background:rgba(255,255,255,.05);color:var(--ink);font:700 .85rem var(--body);cursor:pointer;transition:.2s}
.prio button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
.prio button.on{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 55%,transparent)}
.pnote{font-size:.78rem;color:var(--muted);margin:0 0 10px}
@media (max-width:480px){.streak .flame{width:38px;height:38px}.ssub{max-width:150px}}

/* colourful text on black */
.time span{background:linear-gradient(90deg,#5ee7ff,#a78bff,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
.months select{color:var(--cyan)}
.label{color:var(--amber)}
.panel h2{background:linear-gradient(90deg,#fff,#c8b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.day.we .dn{color:var(--pink)}
.day.sel.we .dn{color:#000}
.day .wd{color:var(--cyan)}
.day.sel .wd{color:#000}
.tag{color:var(--violet)}
footer{color:var(--amber)}
footer span{color:var(--cyan)}
.pnote{color:var(--amber);opacity:.85}

/* big celebration from Mochi */
.cf2{border-radius:2px;animation:fly2 2.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly2{0%{transform:translate(0,0) rotate(0);opacity:1}45%{transform:translate(var(--x),var(--y)) rotate(calc(var(--r)*.5));opacity:1}100%{transform:translate(calc(var(--x)*1.25),calc(var(--y) + 380px)) rotate(var(--r));opacity:0}}

/* ===================== MODE SWITCH (Daily <-> JEE) — compositor-only animations ===================== */
.wrap{padding-top:80px}
.wrap,.catbox{transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .4s ease}
body.jee-open .wrap,body.jee-open .catbox{transform:scale(.95);opacity:0;pointer-events:none}
body.jee-open{overflow:hidden}
/* once JEE fully covers the screen, stop painting / animating the Daily page undern
